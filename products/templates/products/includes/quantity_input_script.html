<script>
    // Disable +/- buttons outside 1-99 range for the current quantity input group
    function handleEnableDisable(inputGroup) {
        var qtyInput = inputGroup.find('.qty_input');
        var currentValue = parseInt(qtyInput.val());

        if (isNaN(currentValue)) {
            currentValue = 1;
            qtyInput.val(currentValue);
        }

        var minusDisabled = currentValue < 2;
        var plusDisabled = currentValue > 98;

        inputGroup.find('.decrement-qty').prop('disabled', minusDisabled);
        inputGroup.find('.increment-qty').prop('disabled', plusDisabled);
    }

    // Ensure proper enabling/disabling of all quantity groups on page load
    $('.qty_input').each(function () {
        handleEnableDisable($(this).closest('.input-group'));
    });

    // Check enable/disable every time an input is changed
    $('.qty_input').change(function () {
        handleEnableDisable($(this).closest('.input-group'));
    });

    // Increment quantity
    $('.increment-qty').click(function (e) {
        e.preventDefault();
        var inputGroup = $(this).closest('.input-group');
        var qtyInput = inputGroup.find('.qty_input');
        var currentValue = parseInt(qtyInput.val()) || 1;
        qtyInput.val(currentValue + 1);
        handleEnableDisable(inputGroup);
    });

    // Decrement quantity
    $('.decrement-qty').click(function (e) {
        e.preventDefault();
        var inputGroup = $(this).closest('.input-group');
        var qtyInput = inputGroup.find('.qty_input');
        var currentValue = parseInt(qtyInput.val()) || 1;
        qtyInput.val(currentValue - 1);
        handleEnableDisable(inputGroup);
    });
</script>
