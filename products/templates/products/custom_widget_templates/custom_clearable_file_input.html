{% if widget.is_initial %}
<div class="form-group mb-3">
    <p class="mb-2">{{ widget.initial_text }}:</p>
    <a href="{{ widget.value.url }}">
        <img width="96" height="96" class="rounded shadow-sm" src="{{ widget.value.url }}">
    </a>
    {% if not widget.required %}
    <div class="custom-control custom-checkbox mt-2">
        <input class="custom-control-input" type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}">
        <label class="custom-control-label text-danger" for="{{ widget.checkbox_id }}">{{ widget.clear_checkbox_label
            }}</label>
    </div>
    {% endif %}
    {{ widget.input_text }}
</div>
{% endif %}
<div class="form-group mb-3">
    <input id="new-image" class="form-control-file border-black rounded-0 w-100" type="{{ widget.type }}" name="{{ widget.name }}" {%
        include "django/forms/widgets/attrs.html" %}>
    <p class="text-danger mb-0 mt-2" id="filename"></p>
</div>
